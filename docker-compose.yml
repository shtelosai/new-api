# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker compose up -d --build
#   2. Access at http://localhost:3000
#
# Production shape:
#   - Build local image from Dockerfile.shtlcloud
#   - Use external MySQL via SQL_DSN in .env
#   - Keep Redis and claude-agent-probe as local sidecars
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.shtlcloud
    image: new-api:shtlcloud
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # 演练期 SQL_DSN 指向 tlcloud_twork；切换后指向 tlcloud_newapi。
      # 示例：user:pass@tcp(host:3306)/tlcloud_twork?charset=utf8mb4&parseTime=true&loc=Local
      - SQL_DSN=${SQL_DSN:?please set SQL_DSN in .env}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:-redis://:123456@redis:6379} # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - MEMORY_CACHE_ENABLED=true
      - SYNC_FREQUENCY=${SYNC_FREQUENCY:-10}
      - CLAUDE_AGENT_PROBE_URL=http://claude-agent-probe:3021
      - CLAUDE_AGENT_PROBE_TOKEN=${CLAUDE_AGENT_PROBE_TOKEN:?please set CLAUDE_AGENT_PROBE_TOKEN in .env}
      - CLAUDE_AGENT_PROBE_TIMEOUT_SECONDS=${CLAUDE_AGENT_PROBE_TIMEOUT_SECONDS:-20}
      - SESSION_SECRET=${SESSION_SECRET:?please set SESSION_SECRET in .env}
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=${NODE_NAME:-new-api-node-1}  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_COOKIE_SECURE=true  # 启用 Secure session cookie，必须同时配置 SESSION_COOKIE_TRUSTED_URL (Enable Secure session cookies; requires SESSION_COOKIE_TRUSTED_URL)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # 可信 HTTPS 入口地址，多个用英文逗号分隔 (Trusted HTTPS entry URLs, comma-separated)
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - claude-agent-probe
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

  claude-agent-probe:
    build:
      context: .
      dockerfile: Dockerfile.claude-agent-probe
    image: new-api-claude-agent-probe:local
    container_name: claude-agent-probe
    restart: always
    environment:
      - PORT=3021
      - PROBE_TOKEN=${CLAUDE_AGENT_PROBE_TOKEN:?please set CLAUDE_AGENT_PROBE_TOKEN in .env}
      - DEFAULT_PROBE_TIMEOUT_MS=${CLAUDE_AGENT_PROBE_DEFAULT_TIMEOUT_MS:-20000}
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3021/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

